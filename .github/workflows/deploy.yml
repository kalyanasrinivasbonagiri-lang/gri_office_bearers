name: Deploy GRI website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Prepare direct profile URLs for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          node --input-type=module -e "import fs from 'node:fs'; import path from 'node:path'; const html=fs.readFileSync('dist/index.html','utf8'); const people=fs.readdirSync('src/people').filter(file=>file.endsWith('.js')).map(file=>path.basename(file,'.js')); for (const slug of people) { for (const route of [slug,'office-bearers/'+slug]) { const dir=path.join('dist',route); fs.mkdirSync(dir,{recursive:true}); fs.writeFileSync(path.join(dir,'index.html'),html); } }"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
